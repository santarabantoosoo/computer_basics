<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎓 متابعة التكليف — أساسيات الكمبيوتر</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    min-height: 100vh;
    padding: 20px;
  }

  .container { max-width: 900px; margin: 0 auto; }

  header {
    background: rgba(255,255,255,0.95);
    border-radius: 24px;
    padding: 24px 28px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }

  header h1 {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(90deg, #667eea, #e73c7e, #f093fb);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  header p { color: #666; font-size: 1.05rem; margin-top: 4px; }

  .today-date {
    display: inline-block;
    margin-top: 10px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    color: #fff;
    padding: 6px 22px;
    border-radius: 999px;
    font-weight: 700;
  }

  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 14px;
    margin-bottom: 20px;
  }

  .stat-card {
    background: rgba(255,255,255,0.95);
    border-radius: 18px;
    padding: 16px;
    text-align: center;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .stat-card .num { font-size: 2rem; font-weight: 900; }
  .stat-card .lbl { color: #555; font-weight: 600; }
  .stat-done .num { color: #16a34a; }
  .stat-skip .num { color: #dc2626; }
  .stat-total .num { color: #667eea; }

  .section-title {
    color: #fff;
    font-size: 1.3rem;
    font-weight: 800;
    margin: 18px 4px 12px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
  }

  .student-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }

  .student-card {
    background: #fff;
    border-radius: 20px;
    padding: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
    transition: transform 0.2s;
  }

  .student-card:hover { transform: translateY(-4px); }

  .student-card.done { border: 3px solid #16a34a; }
  .student-card.skipped { border: 3px solid #dc2626; }

  .student-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }

  .dot {
    width: 20px; height: 20px;
    border-radius: 50%;
    flex-shrink: 0;
    border: 2px solid #ccc;
    background: #e5e7eb;
  }

  .dot.green { background: #16a34a; border-color: #15803d; box-shadow: 0 0 8px rgba(22,163,74,0.6); }
  .dot.red { background: #dc2626; border-color: #b91c1c; box-shadow: 0 0 8px rgba(220,38,38,0.6); }

  .student-name { font-size: 1.25rem; font-weight: 800; color: #1f2937; }

  .skip-count {
    font-size: 0.95rem;
    font-weight: 700;
    margin-bottom: 12px;
    padding: 6px 12px;
    border-radius: 12px;
    display: inline-block;
  }

  .skip-0 { background: #dcfce7; color: #166534; }
  .skip-low { background: #fef9c3; color: #854d0e; }
  .skip-high { background: #fee2e2; color: #991b1b; }

  .btn-row { display: flex; gap: 10px; }

  .btn {
    flex: 1;
    border: none;
    padding: 11px 8px;
    border-radius: 14px;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
    color: #fff;
    transition: filter 0.15s, transform 0.1s;
  }

  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: scale(0.96); }

  .btn-done { background: linear-gradient(135deg, #16a34a, #4ade80); }
  .btn-skip { background: linear-gradient(135deg, #dc2626, #f87171); }
  .btn-reset {
    background: linear-gradient(135deg, #6b7280, #9ca3af);
    margin-top: 10px;
    width: 100%;
  }

  .history { margin-top: 12px; }

  .history details summary {
    cursor: pointer;
    font-weight: 700;
    color: #667eea;
    font-size: 0.95rem;
  }

  .history ul { list-style: none; margin-top: 8px; max-height: 150px; overflow-y: auto; }

  .history li {
    font-size: 0.9rem;
    padding: 4px 10px;
    border-radius: 8px;
    margin-bottom: 4px;
    font-weight: 600;
  }

  .h-done { background: #dcfce7; color: #166534; }
  .h-skip { background: #fee2e2; color: #991b1b; }

  .danger-zone {
    background: rgba(255,255,255,0.95);
    border-radius: 20px;
    padding: 18px;
    margin-top: 24px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18);
  }

  .danger-zone button {
    border: none;
    padding: 12px 26px;
    border-radius: 14px;
    background: linear-gradient(135deg, #dc2626, #f87171);
    color: #fff;
    font-family: 'Cairo', sans-serif;
    font-size: 1rem;
    font-weight: 800;
    cursor: pointer;
  }

  footer {
    text-align: center;
    color: rgba(255,255,255,0.85);
    font-weight: 600;
    margin-top: 26px;
  }

  @media (max-width: 480px) {
    header h1 { font-size: 1.4rem; }
    .student-name { font-size: 1.05rem; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>🎓 متابعة التكليف — أساسيات الكمبيوتر</h1>
    <p>سجّل يوميًا مين سلّم التكليف ومين تخطّاه 💚✅ ❌🔴</p>
    <div class="today-date">📅 <span id="today"></span></div>
  </header>

  <div class="stats-bar">
    <div class="stat-card stat-total"><div class="num" id="stTotal">0</div><div class="lbl">عدد الطلاب</div></div>
    <div class="stat-card stat-done"><div class="num" id="stDone">0</div><div class="lbl">س لّم اليوم ✅</div></div>
    <div class="stat-card stat-skip"><div class="num" id="stSkip">0</div><div class="lbl">خطّى اليوم ❌</div></div>
  </div>

  <div class="section-title">👥 الطلاب</div>
  <div class="student-grid" id="grid"></div>

  <div class="danger-zone">
    <button onclick="resetAll()">🗑️ تصفير كل البيانات (لأنشاء فصل جديد)</button>
  </div>

  <footer>💾 البيانات محفوظة على جهازك في localStorage — بيانات كل جهاز منفصلة.</footer>
</div>

<script>
const STUDENTS = ["عالية","طارى","حبيبة","ياسمين","مبرا","حمراء","أنس","حذيفة","صبر"];

const KEY = "computer_basics_hw_v1";
// data: { "YYYY-MM-DD": { "name": "done" | "skip" } }
let data = JSON.parse(localStorage.getItem(KEY) || "{}");

function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function todayLabel() {
  return new Date().toLocaleDateString("ar-EG", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
}

function skipCount(name) {
  let c = 0;
  for (const day in data) if (data[day][name] === "skip") c++;
  return c;
}

function mark(name, status) {
  const t = todayKey();
  if (!data[t]) data[t] = {};
  if (data[t][name] === status) delete data[t][name]; // click again to undo
  else data[t][name] = status;
  save();
  render();
}

function resetAll() {
  if (confirm("⚠️ هل أنت متأكد؟ سيتم حذف كل سجل التكليف نهائيًا!")) {
    data = {};
    save();
    render();
  }
}

function skipClass(c) {
  if (c === 0) return "skip-0";
  if (c <= 2) return "skip-low";
  return "skip-high";
}

function render() {
  document.getElementById("today").textContent = todayLabel();
  const t = todayKey();
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  let doneToday = 0, skipToday = 0;

  STUDENTS.forEach((name, i) => {
    const status = data[t] ? data[t][name] : null;
    const sc = skipCount(name);

    if (status === "done") doneToday++;
    if (status === "skip") skipToday++;

    let history = "";
    const days = Object.keys(data).sort().reverse().slice(0, 12);
    if (days.length) {
      const items = days.map(d => {
        const s = data[d][name];
        if (!s) return "";
        const done = s === "done";
        return '<li class="' + (done ? "h-done" : "h-skip") + '">' +
               (done ? "✅ س لم" : "❌ خطّى") + " — " +
               new Date(d + "T12:00:00").toLocaleDateString("ar-EG", { day:"numeric", month:"long" }) +
               "</li>";
      }).join("");
      history = '<div class="history"><details><summary>📜 السجل</summary><ul>' + items + "</ul></details></div>";
    }

    const card = document.createElement("div");
    card.className = "student-card " + (status === "done" ? "done" : status === "skip" ? "skipped" : "");
    card.innerHTML =
      '<div class="student-head">' +
        '<span class="dot ' + (status === "done" ? "green" : status === "skip" ? "red" : "") + '"></span>' +
        '<span class="student-name">' + name + "</span>" +
      "</div>" +
      '<div><span class="skip-count ' + skipClass(sc) + '">❌ خطّى التكليف ' + sc + " مرة</span></div>" +
      '<div class="btn-row">' +
        '<button class="btn btn-done" onclick="mark(\'' + name + '\',\'done\')">✅ سلّم</button>' +
        '<button class="btn btn-skip" onclick="mark(\'' + name + '\',\'skip\')">❌ خطّى</button>' +
      "</div>" + history;
    grid.appendChild(card);
  });

  document.getElementById("stTotal").textContent = STUDENTS.length;
  document.getElementById("stDone").textContent = doneToday;
  document.getElementById("stSkip").textContent = skipToday;
}

render();
</script>
</body>
</html>
