<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة التكليفات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(135deg, #3b82f6, #8b5cf6, #ec4899);
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 700px; margin: 0 auto; }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.2);
  }
  h1 { text-align: center; color: #4c1d95; font-size: 1.6rem; font-weight: 900; margin-bottom: 6px; }
  .date { text-align: center; color: #6b7280; font-weight: 700; margin-bottom: 16px; }
  h2 { color: #1e3a8a; font-size: 1.2rem; font-weight: 800; margin-bottom: 14px; }

  .row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    margin-bottom: 10px;
    transition: border-color 0.2s, background 0.2s;
  }
  .row.checked { border-color: #16a34a; background: #f0fdf4; }
  .row input { width: 24px; height: 24px; accent-color: #16a34a; cursor: pointer; flex-shrink: 0; }
  .row label { font-size: 1.15rem; font-weight: 700; color: #1f2937; cursor: pointer; flex: 1; }
  .miss {
    background: #fee2e2; color: #b91c1c;
    font-weight: 800; font-size: 0.9rem;
    padding: 4px 12px; border-radius: 999px;
  }
  .miss.zero { background: #dcfce7; color: #166534; }

  .btn {
    display: block; width: 100%;
    border: none; cursor: pointer;
    font-family: 'Cairo', sans-serif;
    font-size: 1.1rem; font-weight: 800;
    color: #fff; padding: 14px;
    border-radius: 12px;
    background: linear-gradient(135deg, #16a34a, #4ade80);
    transition: filter 0.15s;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn:disabled { background: #9ca3af; cursor: not-allowed; }
  .btn.small { background: #6b7280; margin-top: 10px; font-size: 0.95rem; padding: 10px; }
  .saved-msg { text-align: center; color: #16a34a; font-weight: 800; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="container">

  <div class="card">
    <h1>📋 متابعة التكليفات</h1>
    <div class="date" id="today"></div>
    <h2>✅ الطلاب الذين أنجزوا التكليف اليوم</h2>
    <div id="rows"></div>
    <button class="btn" id="saveBtn" onclick="saveDay()">💾 حفظ سجل اليوم</button>
    <div class="saved-msg" id="savedMsg">✔️ تم حفظ سجل اليوم بنجاح</div>
    <button class="btn small" onclick="resetAll()">🗑️ تصفير جميع البيانات</button>
  </div>

  <div class="card">
    <h2>📊 عدد التكليفات المفقودة لكل طالب</h2>
    <div id="dashboard"></div>
  </div>

</div>

<script>
const STUDENTS = ["علي","عالية","حبيبة","ياسمين","ميرا","عمر","أنس","حمزة","حذيفة"];
const KEY = "computer_basics_simple_v1";

let data = JSON.parse(localStorage.getItem(KEY) || '{"ticks":{},"missing":{},"saved":{}}');
if (!data.saved) data.saved = {}; // توافق البيانات القديمة

function save() { localStorage.setItem(KEY, JSON.stringify(data)); }

function todayKey() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}

function isSaved() { return data.saved[todayKey()] === true; }

function toggle(name, checked) {
  const t = todayKey();
  if (isSaved()) { render(); return; } // اليوم محفوظ، لا تغيير
  if (!data.ticks[t]) data.ticks[t] = [];
  if (checked) {
    if (!data.ticks[t].includes(name)) data.ticks[t].push(name);
  } else {
    data.ticks[t] = data.ticks[t].filter(n => n !== name);
  }
  save();
  render();
}

function saveDay() {
  if (isSaved()) return;
  const t = todayKey();
  data.ticks[t] = data.ticks[t] || [];
  STUDENTS.forEach(name => {
    if (!data.ticks[t].includes(name)) {
      data.missing[name] = (data.missing[name] || 0) + 1;
    }
  });
  data.saved[t] = true;
  save();
  render();
}

function resetAll() {
  if (confirm("هل أنت متأكد من حذف جميع البيانات؟")) {
    data = { ticks: {}, missing: {}, saved: {} };
    save();
    render();
  }
}

function render() {
  document.getElementById("today").textContent =
    new Date().toLocaleDateString("ar", { weekday:"long", day:"numeric", month:"long", year:"numeric" });

  const t = todayKey();
  const ticked = data.ticks[t] || [];
  const saved = isSaved();

  document.getElementById("saveBtn").disabled = saved;
  document.getElementById("savedMsg").style.display = saved ? "block" : "none";

  const rows = document.getElementById("rows");
  rows.innerHTML = "";
  STUDENTS.forEach(name => {
    const checked = ticked.includes(name);
    const m = data.missing[name] || 0;
    const row = document.createElement("div");
    row.className = "row" + (checked ? " checked" : "");
    row.innerHTML =
      '<input type="checkbox" id="cb_' + name + '" ' + (checked ? "checked" : "") +
        (saved ? " disabled" : "") + ' onchange="toggle(\'' + name + '\', this.checked)">' +
      '<label for="cb_' + name + '">' + name + "</label>" +
      '<span class="miss' + (m === 0 ? " zero" : "") + '">مفقود: ' + m + "</span>";
    rows.appendChild(row);
  });

  const dash = document.getElementById("dashboard");
  dash.innerHTML = "";
  STUDENTS.forEach(name => {
    const m = data.missing[name] || 0;
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML =
      '<label style="cursor:default">' + name + "</label>" +
      '<span class="miss' + (m === 0 ? " zero" : "") + '">' + m + " تكليف" + (m > 1 ? "ات" : "") + " مفقودة</span>";
    dash.appendChild(row);
  });
}

render();
</script>
</body>
</html>
