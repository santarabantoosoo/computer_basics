<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القفل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Cairo', sans-serif;
    background: linear-gradient(160deg, #1e293b, #0f172a);
    color: #f8fafc;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .stage {
    width: min(92vw, 420px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .gate-area {
    position: relative;
    width: 100%;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  }
  .reveal {
    background: #fef9c3;
    color: #1e293b;
    padding: 22px 20px;
    text-align: center;
  }
  .reveal h2 { margin: 0 0 12px; font-size: 1.2rem; color: #854d0e; }
  .hadith {
    font-size: 1.15rem;
    line-height: 2;
    user-select: text;
    -webkit-user-select: text;
    margin: 0;
  }

  .door {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 50%;
    background: repeating-linear-gradient(90deg, #475569 0 18px, #334155 18px 36px);
    transition: transform 1.6s ease-in-out;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 3rem;
    z-index: 2;
  }
  .door.left { left: 0; border-left: 6px solid #facc15; }
  .door.right { right: 0; border-right: 6px solid #facc15; }
  .door.left.open { transform: translateX(-100%); }
  .door.right.open { transform: translateX(100%); }

  .panel {
    width: 100%;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 18px;
    padding: 20px;
    text-align: center;
    transition: opacity 0.5s;
  }
  .panel.hidden { opacity: 0; pointer-events: none; }
  .panel h1 { font-size: 1.3rem; margin: 0 0 14px; }

  .display {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-bottom: 10px;
  }
  .display span {
    width: 40px;
    height: 50px;
    border-radius: 10px;
    background: #0f172a;
    border: 2px solid #475569;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    font-weight: 700;
  }
  .display span.filled { border-color: #facc15; }
  .display.shake { animation: shake 0.4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-8px); }
    80% { transform: translateX(8px); }
  }

  .message { min-height: 1.5em; color: #fca5a5; margin: 0; font-weight: 700; }

  .ctx-menu {
    position: fixed;
    z-index: 100;
    background: #f8fafc;
    border: 2px solid #334155;
    border-radius: 12px;
    padding: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    min-width: 120px;
  }
  .ctx-menu[hidden] { display: none; }
  .ctx-menu button {
    display: block;
    width: 100%;
    background: none;
    border: 0;
    border-radius: 8px;
    padding: 8px 14px;
    font: inherit;
    font-size: 1.05rem;
    font-weight: 700;
    color: #1e293b;
    text-align: right;
    cursor: pointer;
  }
  .ctx-menu button:hover, .ctx-menu button:focus { background: #fef9c3; outline: none; }
</style>
</head>
<body>
<main class="stage">
  <div class="gate-area">
    <div class="reveal">
      <p class="hadith" id="hadithText">عن عثمان بن عفان عن النبي ﷺ قال: «خيركم من تعلَّمَ القرآن وعلَّمه». صحيح البخاريّ (٥٠٢٧)</p>
    </div>
    <div class="door left" id="doorLeft">🔒</div>
    <div class="door right" id="doorRight">🔒</div>
  </div>

  <section class="panel" id="panel">
    <h1>أدخل الرمز لفتح البوابة</h1>
    <div class="display" id="display">
      <span></span><span></span><span></span><span></span><span></span><span></span>
    </div>
    <p class="message" id="message"></p>
  </section>
</main>

<div class="ctx-menu" id="ctxMenu" role="menu" hidden>
  <button type="button" role="menuitem" id="copyItem">نسخ</button>
</div>

<script>
  const CODE = '123456';
  let entered = '';
  const panel = document.getElementById('panel');
  const display = document.getElementById('display');
  const slots = display.querySelectorAll('span');
  const message = document.getElementById('message');

  function render() {
    slots.forEach((s, i) => {
      s.textContent = entered[i] ? '•' : '';
      s.classList.toggle('filled', Boolean(entered[i]));
    });
  }

  function wrong() {
    message.textContent = 'الرمز غير صحيح، حاول مرة أخرى';
    display.classList.remove('shake');
    void display.offsetWidth;
    display.classList.add('shake');
    entered = '';
    render();
  }

  function unlock() {
    message.textContent = '';
    document.getElementById('doorLeft').classList.add('open');
    document.getElementById('doorRight').classList.add('open');
    panel.classList.add('hidden');
    playFanfare();
  }

  function press(key) {
    if (entered.length >= CODE.length) return;
    entered += key;
    render();
    if (entered.length === CODE.length) {
      if (entered === CODE) {
        unlock();
      } else {
        setTimeout(wrong, 250);
      }
    }
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !ctxMenu.hidden) {
      closeMenu();
      return;
    }
    if (/^[0-9]$/.test(e.key)) press(e.key);
    else if (e.key === 'Backspace') {
      entered = entered.slice(0, -1);
      render();
    } else if (e.key === 'Escape') {
      entered = '';
      message.textContent = '';
      render();
    }
  });

  const ctxMenu = document.getElementById('ctxMenu');
  const copyItem = document.getElementById('copyItem');

  function closeMenu() {
    ctxMenu.hidden = true;
  }

  function copySelection() {
    try {
      document.execCommand('copy');
    } catch (err) {
      /* copy blocked: nothing else to do */
    }
  }

  document.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    ctxMenu.hidden = false;
    const w = ctxMenu.offsetWidth;
    const h = ctxMenu.offsetHeight;
    ctxMenu.style.left = Math.max(8, Math.min(e.clientX, window.innerWidth - w - 8)) + 'px';
    ctxMenu.style.top = Math.max(8, Math.min(e.clientY, window.innerHeight - h - 8)) + 'px';
    copyItem.focus();
  });

  copyItem.addEventListener('click', () => {
    copySelection();
    closeMenu();
  });

  document.addEventListener('mousedown', (e) => {
    if (!ctxMenu.contains(e.target)) closeMenu();
  });

  window.addEventListener('scroll', closeMenu, { passive: true });
  window.addEventListener('resize', closeMenu);

  function playFanfare() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5, 1046.5, 1568];
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const t = ctx.currentTime + i * 0.12;
        osc.type = 'triangle';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.3, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
        osc.connect(gain).connect(ctx.destination);
        osc.start(t);
        osc.stop(t + 0.55);
      });
    } catch (err) {
      /* audio blocked: the gate still opens */
    }
  }

  render();
</script>
</body>
</html>
